<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluador · Programa de Chagas</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1b2530; --muted:#5a6a7a; --line:#d3dae2;
  --brand:#1d4f7c; --brand-soft:#e6eff8;
  --ok:#17703f; --ok-soft:#e1f3e8; --bad:#b0281f; --bad-soft:#fbe5e2;
  --neu:#4a5866; --neu-soft:#eceff3; --warn:#7a5200; --warn-soft:#fff2d1;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h2{font-size:1.1rem;margin:0 0 .8rem}
h3{font-size:.95rem;margin:1.2rem 0 .5rem;color:var(--brand)}
.muted{color:var(--muted)}

/* ---------- barra superior ---------- */
/* Escritorio/tablet: la fila 1 (evaluación y exportar) se desplaza; solo pestañas y avance quedan fijas */
.top{display:contents}
.row1,.row2{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 18px}
.row1{background:#fff;border-bottom:1px solid var(--line)}
.row2{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06);padding-top:8px;padding-bottom:0}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand strong{font-size:1.05rem;color:var(--brand)}
.brand .sub{font-size:.78rem;color:var(--muted)}
.evsel{display:flex;gap:6px;align-items:center;flex:1 1 320px;min-width:260px}
.evsel select{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.exp{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.danger{background:#fff;color:var(--bad);border-color:#e4b3ae}
.btn.sm{padding:5px 10px;font-size:.88rem;margin-top:8px}
.ico{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--bad)}
#tabs{display:flex;gap:4px;flex-wrap:wrap}
#tabs button{border:1px solid var(--line);background:#fff;border-radius:8px 8px 0 0;padding:7px 12px;cursor:pointer;color:var(--muted)}
#tabs button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand);font-weight:600}
#chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--brand-soft);border-radius:999px;padding:3px 11px;font-size:.85rem}
.chip small{color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
#saveStatus{font-size:.8rem;color:var(--muted);min-width:130px;text-align:right}
#saveStatus.err{color:var(--bad);font-weight:600}

/* ---------- contenido ---------- */
main{max-width:1000px;margin:18px auto 80px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
label.f input,label.f textarea,.obs,.caserow input,.ptable input{
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:38px;overflow:hidden}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid #6aa5da;outline-offset:1px}
.ptable{width:100%;border-collapse:collapse;margin-top:4px}
.ptable th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;padding:4px 6px}
.ptable td{padding:3px 4px}
.ptable td:last-child{width:40px}

details.dim{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
details.dim>summary{cursor:pointer;padding:12px 16px;font-weight:700;background:var(--brand-soft);color:var(--brand);display:flex;gap:10px;align-items:center;list-style:none}
details.dim>summary::-webkit-details-marker{display:none}
details.dim>summary::before{content:"▸";transition:transform .15s}
details.dim[open]>summary::before{transform:rotate(90deg)}
.dnum{background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;font-size:.85rem}
.dstat{margin-left:auto;font-weight:500;font-size:.85rem;color:var(--muted)}
.crit{padding:14px 16px;border-top:1px solid var(--line)}
.crit-head{display:flex;gap:10px;align-items:flex-start}
.cn{flex:none;background:var(--neu-soft);border-radius:6px;min-width:28px;text-align:center;font-weight:700;padding:1px 6px}
.ct{margin:0;font-weight:600}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px;margin:8px 0 10px 38px;font-size:.86rem}
.meta div{min-width:0}
.meta dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.meta dd{margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-left:38px}
.segb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer}
.segb:hover{background:var(--neu-soft)}
.segb.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.segb.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.segb.on.neu{background:var(--neu);border-color:var(--neu);color:#fff}
.obs{margin:10px 0 0 38px;width:calc(100% - 38px)}
.casos{margin:12px 0 0 38px;padding:10px 12px;background:#f7f9fb;border:1px dashed var(--line);border-radius:10px}
.casos-h{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;font-weight:600;color:var(--brand);margin-bottom:6px}
.casos-h small{font-weight:400;color:var(--muted)}
.caso{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.caso textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.caso .badge{margin-top:4px}
.caserow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.badge{flex:none;background:var(--neu-soft);border-radius:6px;padding:3px 9px;font-size:.85rem;min-width:64px;text-align:center}
.caseans{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 6px 38px}
.caseans .seg{margin-left:0}
.clabel{min-width:110px;font-size:.88rem;font-weight:600}

table.res{width:100%;border-collapse:collapse;margin-bottom:6px}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
table.res th{font-size:.8rem;color:var(--muted)}
table.res td.n{text-align:center;width:110px}
table.res td.p{width:240px}
table.res tr.tot td{font-weight:700;background:var(--neu-soft)}
.bar{height:9px;background:var(--neu-soft);border-radius:6px;overflow:hidden;display:inline-block;width:130px;vertical-align:middle;margin-right:8px}
.bar i{display:block;height:100%;background:var(--brand)}
.warns{margin:0;padding-left:20px}
.warns li{margin:3px 0}
.note{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:.86rem;color:var(--warn);margin-top:10px}
label.f select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
.menu-btn,.tfull-m,.sub.mob{display:none}
.tn::after{content:" ·";margin-right:.35em}
.tshort{display:none}
.metad>summary{display:none}
.support{max-width:1000px;margin:0 auto 40px;padding:14px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.support h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px;color:var(--brand)}
.support p{margin:0}
.support a{color:var(--brand);font-weight:600}

/* ---------- móvil ---------- */
@media (max-width:700px){
  html{scroll-padding-top:100px}
  body{font-size:16px;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px!important}
  .top{display:block;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .row1{padding:8px 12px;gap:6px 10px;flex-wrap:wrap;border-bottom:0}
  .row2{position:static;box-shadow:none;border-bottom:0;padding:0 12px 8px;gap:4px 8px}
  .brand{flex:1;min-width:0}
  .brand strong{font-size:1rem}
  .brand .sub.desk{display:none}
  .brand .sub.mob{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-btn{display:inline-block;padding:8px 14px}
  .evsel,.exp{display:none;flex:1 1 100%;min-width:0}
  .top.menu-open .evsel{display:flex}
  .top.menu-open .exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .top.menu-open .btn{padding:11px 10px}
  .evsel{flex-wrap:wrap;gap:8px}
  .evsel select{padding:10px 8px;flex:1 1 100%}
  .evsel .btn{flex:1}
  #chips{margin-left:0;gap:6px;flex:1}
  .chip{font-size:.8rem;padding:2px 9px}
  #saveStatus{display:none;min-width:0;flex:1 1 100%;text-align:left}
  .top.menu-open #saveStatus{display:block}
  /* pestañas abajo */
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
        display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.08)}
  #tabs button{border:0;border-top:3px solid transparent;border-radius:0;background:#fff;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;line-height:1.1;min-height:58px}
  #tabs button.on{background:#fff;border-top-color:var(--brand);color:var(--brand)}
  .tn{font-size:1.05rem;font-weight:700}
  .tn::after{content:""}
  .tfull{display:none}
  .tshort{display:inline}
  main{margin:10px auto 20px;padding:0 10px}
  .card{padding:14px;border-radius:10px;margin-bottom:12px}
  h2{font-size:1.02rem}
  /* personas como tarjetas */
  .ptable thead{display:none}
  .ptable tr{display:block;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px;position:relative}
  .ptable td{display:block;width:auto!important;padding:3px 0}
  .ptable td::before{content:attr(data-label);display:block;font-size:.75rem;color:var(--muted);margin-bottom:2px}
  .ptable td:last-child{text-align:right}
  .ptable td:last-child::before{content:""}
  .ptable input{padding:10px}
  .btn.sm{width:100%;margin:6px 0 0!important;padding:11px}
  /* criterios */
  details.dim>summary{flex-wrap:wrap;padding:12px}
  .dstat{flex:1 1 100%;margin-left:0;font-size:.8rem}
  .crit{padding:12px}
  .cn{min-width:26px;font-size:.9rem}
  .meta{display:block;margin:6px 0 10px}
  .metad{margin:6px 0 10px;border:1px solid var(--line);border-radius:8px;background:#fafbfc}
  .metad>summary{display:block;cursor:pointer;padding:9px 12px;font-size:.85rem;color:var(--brand);font-weight:600}
  .metad .meta{margin:0;padding:0 12px 10px}
  .meta div{margin-bottom:6px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-left:0}
  .seg.n3{grid-template-columns:repeat(3,1fr)}
  .segb{min-height:46px;border-radius:12px;padding:8px 6px;font-size:.95rem}
  .obs{margin:10px 0 0;width:100%;padding:10px}
  .casos{margin:12px 0 0;padding:10px}
  .casos-h{flex-wrap:wrap}
  .caso{grid-template-columns:1fr auto}
  .caso .badge{grid-column:1/-1;justify-self:start;margin-top:0}
  .caso textarea{padding:10px}
  .casos .btn.sm{margin-top:2px!important}
  .caseans{display:block;margin:10px 0 0}
  .caseans .clabel{display:block;margin-bottom:6px;min-width:0}
  .caserow input{padding:10px}
  .ico{width:42px;height:42px}
  /* resultados */
  table.res th,table.res td{padding:9px 3px;font-size:.88rem}
  table.res td.n{width:58px}
  table.res td.p{width:auto}
  .bar{display:block;width:100%;margin:0 0 3px}
}
@media (min-width:701px){ .metad{margin:0} }

/* ---------- impresión ---------- */
#printRoot{display:none}
@page{size:A4;margin:16mm 14mm 18mm;@bottom-center{content:counter(page);font:9pt Arial}}
@media print{
  body{background:#fff}
  #app{display:none!important}
  #printRoot{display:block}
}
.pdoc{font:10pt/1.35 Calibri,Arial,sans-serif;color:#000}
.pdoc.pagebreak{break-before:page}
.pdoc .ph{margin-bottom:14px}
.pdoc h1{font-size:12.5pt;text-align:center;flex:1;margin:0;line-height:1.3}
.pdoc .psec{background:#e3e6ea;border:1px solid #444;padding:4px 8px;font-weight:700;margin-top:12px;break-after:avoid}
.pdoc .psub{border:1px solid #444;border-top:0;padding:4px 8px;font-weight:700;break-after:avoid}
.pdoc table{width:100%;border-collapse:collapse}
.pdoc th,.pdoc td{border:1px solid #444;padding:3px 6px;vertical-align:top;text-align:left}
.pdoc table.kv th{width:32%;font-weight:400}
.pdoc thead th{background:#f1f3f5;text-align:center}
.pdoc tr{break-inside:avoid}
.pdoc .dimrow td{background:#e3e6ea;font-weight:700}
.pdoc .dimrow,.pdoc .dimrow td{break-after:avoid;page-break-after:avoid}
.pdoc .grp{break-inside:avoid}
.pdoc .c{text-align:center}
.pdoc .box{border:1px solid #444;padding:8px;min-height:60px;white-space:normal}
.pdoc td.sig{height:34px}
.pdoc small{font-weight:400}
.pdoc .pcasos{margin-top:4px;padding-top:3px;border-top:1px dotted #777;font-size:9pt}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row1">
      <div class="brand"><strong>Evaluador · Programa de Chagas</strong><span class="sub desk">Autoevaluación de cumplimiento normativo (APS sin tratamiento antiparasitario)</span><span class="sub mob" id="curTitle"></span></div>
      <button class="btn ghost menu-btn" data-act="menu" aria-expanded="false" aria-controls="evSelect">☰ Menú</button>
      <div class="evsel">
        <select id="evSelect" aria-label="Evaluación guardada"></select>
        <button class="btn ghost" data-act="new" title="Crear una evaluación nueva">+ Nueva</button>
        <button class="btn danger" data-act="del" title="Eliminar la evaluación actual">Eliminar</button>
      </div>
      <div class="exp">
        <button class="btn" data-act="pdf">Exportar PDF</button>
        <button class="btn" data-act="xlsx">Exportar XLSX</button>
        <button class="btn ghost" data-act="jsonexp" title="Descargar un respaldo de esta evaluación">Respaldo .json</button>
        <button class="btn ghost" data-act="jsonimp" title="Cargar un respaldo .json">Importar</button>
        <input type="file" id="fileImp" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="row2">
      <nav id="tabs" role="tablist"></nav>
      <div id="chips"></div>
      <div id="saveStatus" role="status" aria-live="polite"></div>
    </div>
  </header>
  <main id="view"></main>
  <footer class="support" aria-labelledby="supTitle">
    <h2 id="supTitle">Soporte y contacto</h2>
    <p>DESAM Monte Patria · <a href="mailto:ricardocontreras@mpatria.cl">ricardocontreras@mpatria.cl</a></p>
  </footer>
</div>
<div id="printRoot"></div>

<script>
'use strict';
/* =====================================================================
   DATOS DEL FORMATO (editable): criterios, regulación y verificación
   ===================================================================== */
const NG = 'Norma General Técnica Control y Prevención Nacional de la Enfermedad de Chagas.';
const DEC = 'Decreto 7/2019 y Ordinario B51/N° 4203';
const OBJ_A = 'Constatar el cumplimiento de la regulación ministerial relativa a prevención y control de Enfermedad de Chagas en establecimiento de APS de la Región de Coquimbo.';
const OBJ_B = 'Constatar el cumplimiento de la regulación ministerial en relación a la gestante y proceso diagnóstico del recién nacido, hijo/a de madre con Enfermedad de Chagas, en el establecimiento de salud, en relación a caso de gestante específica confirmada.';
const TITLE_A = 'FISCALIZACIÓN<br>CUMPLIMIENTO DE REGULACIÓN MINISTERIAL RELATIVA A LA PREVENCIÓN Y CONTROL DE ENFERMEDAD DE CHAGAS EN ESTABLECIMIENTOS DE ATENCIÓN PRIMARIA SIN PRESTACIÓN DE TRATAMIENTO ANTIPARASITARIO';
const TITLE_B = 'ACTA DE VISITA<br>FISCALIZACIÓN Y AUDITORÍA<br>GESTANTE Y PROCESO DIAGNÓSTICO DE RN/LACTANTES HIJOS/AS DE MADRES CON ENFERMEDAD DE CHAGAS, EN CONTEXTO DE CUMPLIMIENTO DE NORMATIVA.';

const DIMS = [
  {id:'I', name:'Pesquisa', short:'Pesquisa', items:[
    {n:1, t:'Se realiza tamizaje para detección de T. cruzi a toda gestante.', reg:NG+' Pág. 33.', proc:'Revisar base de datos de gestantes y ficha clínica.'},
    {n:2, t:'Se realiza búsqueda activa de casos en mujeres en edad fértil (no embarazadas) con factores de riesgo, en periodo preconcepcional y seguimiento en el Programa de la Mujer.', reg:NG+' Pág. 63.', proc:'Revisar base de datos de mujeres en control preconcepcional y ficha clínica.'},
    {n:3, t:'Se realiza estudio a familiares y personas con nexo epidemiológico de un caso confirmado de Enfermedad de Chagas.', reg:NG+' Pág 31. Manual de Procedimientos para la atención de pacientes con Enfermedad de Chagas 2017. Pág 49.', proc:'Revisar estudio de contacto de 5 casos confirmados con entrega de resultado.'},
    {n:4, t:'Se realiza búsqueda activa de casos en todo RN/lactante hijo de madre con Enfermedad de Chagas conforme a algoritmo diagnóstico.', reg:NG+' Pág. 31, 34 y 75.', proc:'Aplicación de pauta específica (ver Pauta B).'},
    {n:5, t:'Si usuario que requiere toma de muestra para examen de Chagas, rechaza la realización de los exámenes respectivos, queda registro en ficha clínica con nombre, RUN y firma del usuario.', reg:NG+' Pág. 41.', proc:'Revisar constancia de nombre, RUN y firma en 3 a 5 casos de usuarios que rechazan examen.'}
  ]},
  {id:'II', name:'Diagnóstico de laboratorio', short:'Diagnóstico de laboratorio', items:[
    {n:6, t:'El diagnóstico de laboratorio de la infección por T. cruzi por medio de pesquisa de anticuerpos solo es informado al paciente después de realizada la confirmación.', reg:NG+' Pág. 37 y 78.', proc:'Verificar en laboratorio procedimiento respecto al resultado de tamizaje reactivo.'}
  ]},
  {id:'III', name:'Notificación', short:'Notificación', items:[
    {n:7, t:'Los casos confirmados de Enfermedad de Chagas en mayores de 2 años, son notificados como Chagas crónico en Sistema de notificación vigente.', reg:DEC, proc:'Revisar base de datos de casos confirmados de Enfermedad de Chagas en el año evaluado, pertenecientes a pacientes de Hospital respectivo y verificar su condición respecto a notificación.'},
    {n:8, t:'Los recién nacidos hijos de madres con Enfermedad de Chagas son notificados como Enfermedad de Chagas agudo en EPIVIGILA (sospecha o confirmación según corresponda).', reg:DEC, proc:'Revisar base de datos y libro de partos de recién nacidos hijos de madre con Enfermedad de Chagas, nacidos en el año evaluado en Hospital respectivo y verificar su condición respecto a notificación.'},
    {n:9, t:'Los casos de Enfermedad de Chagas agudo no RN son notificados en sistema EPIVIGILA.', reg:DEC, proc:'Revisar los casos notificados como Chagas agudo no RN en EPIVIGILA y verificar que efectivamente sean casos sospechosos o confirmados de Chagas agudo, además revisar si existen casos confirmados de Chagas agudo no RN.'}
  ]},
  {id:'IV', name:'Información', short:'Información', items:[
    {n:10, t:'Las personas confirmadas para Enfermedad de Chagas son informadas de su condición.', reg:NG+' Pág. 41.', proc:'Revisar base de datos de casos confirmados de Enfermedad de Chagas en el año evaluado, pertenecientes a pacientes de Hospital respectivo, seleccionar 5 casos en forma aleatoria y verificar si fueron informadas de su condición, revisando ficha clínica.'},
    {n:11, t:'Las personas confirmadas para Enfermedad de Chagas son informadas de su condición realizando educación que incluya aspectos como: sobre las características de la enfermedad, medidas de prevención, objetivo de sus controles y seguimiento futuro, síntomas que debiera conocer, como señales de consulta de urgencias.', reg:NG+' Pág. 41.', proc:'Revisión de ficha clínica de 5 usuarios.'},
    {n:12, t:'Todo paciente diagnosticado debe ser informado del riesgo que conlleva una eventual inmunodepresión secundaria (cáncer u otras) que puede generar diseminación de la infección, cuadros graves y potencialmente letales.', reg:NG+' Pág. 32.', proc:'Revisión de ficha clínica de 5 usuarios u otra evidencia.'}
  ]},
  {id:'V', name:'Derivaciones para tratamiento y seguimiento', short:'Tratamiento', items:[
    {n:13, t:'Se realiza o refuerza referencia oportuna al tratamiento de casos de puérperas post lactancia.', reg:NG+' Pág. 44, 63.', proc:'Revisar registro de mujeres confirmadas para Enfermedad con parto en los dos años previos al evaluado respecto a tratamiento.'},
    {n:14, t:'Las personas menores 18 años son derivadas para inicio de tratamiento.', reg:NG+' Pág. 44.', proc:'Revisión de interconsultas en menores de 18 años.'},

function newEval(){
  const A = {};
  DIMS.forEach(d=>d.items.forEach(i=>{ A[i.n]={v:'',obs:'',casos:[]}; }));
  return {
    id: uid(), created: Date.now(), updated: Date.now(),
    gen: {fecha: today(), responsable:'', periodo:'', objA: OBJ_A, objB: OBJ_B},
    estab: {nombre:''},
    prof:[BLANK.prof()], part:[BLANK.part()],
    A: A,
    B: {gest:[{id:uid(),nombre:''},{id:uid(),nombre:''}], rn:[{id:uid(),nombre:''},{id:uid(),nombre:''}], ans:{}, obs:{}},
    comA:'', comB:'',
    firmas:[BLANK.firmas()]
  };
}
function normalize(ev){
  const d = newEval();
  ev.id = ev.id || d.id;
  ev.gen = Object.assign({}, d.gen, ev.gen||{});
  ev.estab = Object.assign({}, d.estab, ev.estab||{});
  ['prof','part','firmas'].forEach(k=>{ if(!Array.isArray(ev[k])) ev[k]=d[k]; });
  ev.A = ev.A || {};
  Object.keys(d.A).forEach(k=>{
    if(!ev.A[k]) ev.A[k]={v:'',obs:'',casos:[]};
    else if(!Array.isArray(ev.A[k].casos)) ev.A[k].casos=[];
    else ev.A[k].casos=ev.A[k].casos.slice(0,MAX_CASOS);
  });
  ev.B = ev.B || {};
  ['gest','rn'].forEach(k=>{ if(!Array.isArray(ev.B[k])) ev.B[k]=d.B[k]; });
  ev.B.ans = ev.B.ans || {}; ev.B.obs = ev.B.obs || {};
  ev.comA = ev.comA||''; ev.comB = ev.comB||'';
  ev.created = ev.created||Date.now(); ev.updated = ev.updated||Date.now();
  return ev;
}
/* Redondeo estándar a 1 decimal. Devuelve null si no hay puntaje que aplique. */
function pct(obt, apl){ return apl>0 ? Math.round(obt/apl*1000)/10 : null; }
function fmtPct(p){ if(p===null||p===undefined) return '—'; return (p%1===0? String(p) : p.toFixed(1).replace('.',','))+'%'; }

/* Pauta A: 1 → aplica y obtiene; 0 → aplica; NA / No evaluado / sin responder → no cuentan. */
function scoreA(ev){
  const dims = DIMS.map(d=>{
    let ap=0, ob=0, resp=0;
    d.items.forEach(i=>{
      const v = (ev.A[i.n]||{}).v||'';
      if(v==='1'){ ap++; ob++; } else if(v==='0'){ ap++; }
      if(v!=='') resp++;
    });
    return {id:d.id, name:d.name, short:d.short, aplica:ap, obtenido:ob, pct:pct(ob,ap), respondidos:resp, total:d.items.length};
  });
  const sum = k => dims.reduce((s,d)=>s+d[k],0);
  const ap=sum('aplica'), ob=sum('obtenido');
  return {dims, aplica:ap, obtenido:ob, pct:pct(ob,ap), respondidos:sum('respondidos'), total:sum('total')};
}
/* Pauta B: misma regla, cada caso × criterio es un punto. */
function scoreB(ev){
  const sec = (crits, cases)=>{
    let ap=0, ob=0, resp=0;
    crits.forEach(c=>cases.forEach(k=>{
      const v = ev.B.ans[c.id+'|'+k.id]||'';
      if(v==='1'){ ap++; ob++; } else if(v==='0'){ ap++; }
      if(v!=='') resp++;
    }));
    return {aplica:ap, obtenido:ob, pct:pct(ob,ap), respondidos:resp, total:crits.length*cases.length};
  };
  const g = sec(PB.gest, ev.B.gest), r = sec(PB.rn, ev.B.rn);
  const ap=g.aplica+r.aplica, ob=g.obtenido+r.obtenido;
  return {gest:g, rn:r, aplica:ap, obtenido:ob, pct:pct(ob,ap), respondidos:g.respondidos+r.respondidos, total:g.total+r.total};
}
function warnings(ev){
  const w=[], sA=scoreA(ev), sB=scoreB(ev);
  if(!ev.estab.nombre.trim()) w.push('Falta el nombre del establecimiento.');
  if(!ev.gen.fecha) w.push('Falta la fecha de fiscalización.');
  if(sA.total-sA.respondidos>0) w.push('Pauta A: '+(sA.total-sA.respondidos)+' criterio(s) sin responder (no suman al puntaje).');
  if(sB.total-sB.respondidos>0) w.push('Pauta B: '+(sB.total-sB.respondidos)+' respuesta(s) sin completar (no suman al puntaje).');
  let noObs=0;
  DIMS.forEach(d=>d.items.forEach(i=>{ const a=ev.A[i.n]; if(a.v==='0' && !a.obs.trim()) noObs++; }));
  PB.gest.concat(PB.rn).forEach(c=>{ const hasNo = ev.B.gest.concat(ev.B.rn).some(k=>ev.B.ans[c.id+'|'+k.id]==='0'); if(hasNo && !(ev.B.obs[c.id]||'').trim()) noObs++; });
  if(noObs>0) w.push(noObs+' criterio(s) marcado(s) como "No" sin observación.');
  DIMS.forEach(d=>{ const r=sA.dims.find(x=>x.id===d.id); if(r.total>0 && r.respondidos===r.total && r.aplica===0) w.push('Pauta A, '+d.short+': todos los criterios son NA / No evaluado, no hay puntaje que aplique.'); });
  if(sB.gest.total===0 || sB.rn.total===0) w.push('Pauta B: falta agregar casos de gestante o de RN/lactante.');
  return w;
}

   EXPORTAR XLSX (sin librerías: ZIP "store" + SpreadsheetML escritos a mano)
   ===================================================================== */
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c=CRC_T[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  files.forEach(f=>{
    const nameB=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data), size=data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,size,true); lh.setUint32(22,size,true);
    lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nameB, data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true); ch.setUint32(20,size,true); ch.setUint32(24,size,true);
    ch.setUint16(28,nameB.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30+nameB.length+size;
  });
  const cdSize=central.reduce((s,x)=>s+x.length,0);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true); eo.setUint32(12,cdSize,true); eo.setUint32(16,offset,true);
  const all=parts.concat(central,[new Uint8Array(eo.buffer)]);
  const out=new Uint8Array(all.reduce((s,x)=>s+x.length,0)); let p=0; all.forEach(x=>{ out.set(x,p); p+=x.length; });
  return out;
}
const xmlEsc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
/* Estilos: 0 normal · 1 negrita · 2 título · 3 encabezado · 4 celda con borde · 5 porcentaje · 6 sección · 7 centrado con borde */
function sheetXml(rows, widths, freeze){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(freeze) x+='<sheetViews><sheetView workbookViewId="0"><pane ySplit="'+freeze+'" topLeftCell="A'+(freeze+1)+'" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  if(widths) x+='<cols>'+widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>';
  x+='<sheetData>';
  rows.forEach((r,ri)=>{
    x+='<row r="'+(ri+1)+'">';
    r.forEach((c,ci)=>{
      if(c===null||c===undefined) return;
      const cell=(typeof c==='object')?c:{v:c,s:0}, ref=colName(ci)+(ri+1), s=cell.s||0;
      if(cell.v===null||cell.v===undefined||cell.v==='') x+='<c r="'+ref+'" s="'+s+'"/>';
      else if(typeof cell.v==='number') x+='<c r="'+ref+'" s="'+s+'"><v>'+cell.v+'</v></c>';
      else x+='<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(cell.v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}

  const files=[
    {name:'[Content_Types].xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="'+NS+'" xmlns:r="'+RN+'"><sheets>'+sheets.map((s,i)=>'<sheet name="'+s[0]+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml', text:STYLES_XML}
  ];
  sheets.forEach((s,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml', text:s[1]}));
  return zipStore(files);
}

function download(data, name, mime){
  const blob=new Blob([data],{type:mime}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function exportXLSX(){ const ev=cur(); persist(); download(buildXlsx(ev), fileBase(ev)+'.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }
function exportJSON(){ const ev=cur(); persist(); download(JSON.stringify(ev,null,1), fileBase(ev)+'.json', 'application/json'); }
function importJSON(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(fr.result);
      const list = o && o.items ? Object.values(o.items) : [o];
      let last=null;
      list.forEach(ev=>{ if(!ev||!ev.A||!ev.gen) throw new Error('formato'); normalize(ev); if(store.items[ev.id]) ev.id=uid(); ev.updated=Date.now(); store.items[ev.id]=ev; last=ev.id; });
      store.cur=last; persist(); render();
    }catch(err){ alert('El archivo no corresponde a un respaldo válido de este evaluador.'); }
  };
  fr.readAsText(file);
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
function closeMenu(){ const top=document.querySelector('.top'); if(top){ top.classList.remove('menu-open'); const mb=top.querySelector('.menu-btn'); if(mb) mb.setAttribute('aria-expanded','false'); } }
function onClick(e){
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, ev=store.cur?cur():null;
  if(['new','del','pdf','xlsx','jsonexp','jsonimp','tab'].indexOf(act)>=0) closeMenu();
  switch(act){
    case 'tab': ui.tab=el.dataset.tab; render(); window.scrollTo(0,0); break;
    case 'set': {
      const kind=el.dataset.kind, key=el.dataset.key;
      const before = kind==='A' ? ev.A[key].v : (ev.B.ans[key]||'');
      const nv = before===el.dataset.val ? '' : el.dataset.val;
      if(kind==='A') ev.A[key].v=nv; else { if(nv==='') delete ev.B.ans[key]; else ev.B.ans[key]=nv; }
      el.parentElement.querySelectorAll('.segb').forEach(b=>{ const on=b.dataset.val===nv; b.classList.toggle('on',on); b.setAttribute('aria-checked',on); });
      touch(); break;
    }
    case 'addrow': ev[el.dataset.list].push(BLANK[el.dataset.list]()); touch(); render(); break;
    case 'delrow': ev[el.dataset.list].splice(+el.dataset.i,1); touch(); render(); break;
    case 'copyprof': ev.part=clone(ev.prof); touch(); render(); break;
    case 'addcaso': {
      const n=el.dataset.n, cs=ev.A[n].casos;
      if(cs.length<MAX_CASOS){ cs.push({txt:''}); touch(); refreshCasos(n); const tas=document.querySelectorAll('#casos-'+n+' textarea'); if(tas.length) tas[tas.length-1].focus(); }
      break;
    }
    case 'delcaso': {
      const n=el.dataset.n, i=+el.dataset.i, cs=ev.A[n].casos;
      if(cs[i] && (!cs[i].txt.trim() || confirm('¿Quitar el caso '+(i+1)+' del criterio '+n+' y su comentario?'))){ cs.splice(i,1); touch(); refreshCasos(n); }
      break;
    }
    case 'addcase': ev.B[el.dataset.kind].push({id:uid(),nombre:''}); touch(); render(); break;
    case 'delcase': {
      const arr=ev.B[el.dataset.kind], c=arr[+el.dataset.i];
      if(c && confirm('¿Quitar este caso y sus respuestas?')){ Object.keys(ev.B.ans).forEach(k=>{ if(k.split('|')[1]===c.id) delete ev.B.ans[k]; }); arr.splice(+el.dataset.i,1); touch(); render(); }
      break;
    }
    case 'menu': { const top=document.querySelector('.top'), o=top.classList.toggle('menu-open'); el.setAttribute('aria-expanded',o); break; }
    case 'new': { const n=newEval(); store.items[n.id]=n; store.cur=n.id; ui.tab='antecedentes'; persist(); render(); window.scrollTo(0,0); break; }
    case 'del':
      if(confirm('¿Eliminar la evaluación «'+evTitle(ev)+'»? Esta acción no se puede deshacer. Considere descargar antes un respaldo .json.')){
        delete store.items[store.cur];
        const ids=Object.keys(store.items);
        if(!ids.length){ const n=newEval(); store.items[n.id]=n; ids.push(n.id); }
        store.cur=ids[0]; persist(); render();
      }
      break;
    case 'pdf': exportPDF(); break;
    case 'xlsx': exportXLSX(); break;
    case 'jsonexp': exportJSON(); break;
    case 'jsonimp': document.getElementById('fileImp').click(); break;
  }
}
function onInput(e){
  const t=e.target;
  if(t.dataset && t.dataset.bind){
    setPath(cur(), t.dataset.bind, t.value);
    if(t.tagName==='TEXTAREA') autosize(t);
    if(t.dataset.casename){
      document.querySelectorAll('[data-caselabel="'+t.dataset.casename+'"]').forEach(l=>{ l.textContent=t.value.trim()||t.dataset.fallback; });
    }
    touch();
    if(/^(estab\.nombre|gen\.fecha|gen\.periodo)$/.test(t.dataset.bind)) renderSelect();
  }
}
function onChange(e){
  const t=e.target;
  if(t.id==='evSelect'){ store.cur=t.value; persist(); render(); window.scrollTo(0,0); closeMenu(); }
  else if(t.id==='fileImp' && t.files[0]){ importJSON(t.files[0]); t.value=''; }
}
function init(){
  store=loadStore();
  if(!store.cur || !store.items[store.cur]){
    const ids=Object.keys(store.items);
    if(ids.length) store.cur=ids[0]; else { const n=newEval(); store.items[n.id]=n; store.cur=n.id; }
  }
  try{ localStorage.removeItem(LS_LOGO); }catch(e){}
  if(MQ.addEventListener) MQ.addEventListener('change',render);
  document.addEventListener('click',onClick);
  document.addEventListener('input',onInput);
  document.addEventListener('change',onChange);
  window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(LS_KEY,JSON.stringify(store)); }catch(e){} });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) persist(); });
  render();
  if(!storageOK) setStatus('Almacenamiento del navegador no disponible', true); else persist();
}

if(typeof document==='undefined'){ globalThis.__T={DIMS,PB,newEval,scoreA,scoreB,buildXlsx,printDoc:null,fmtPct,pct,normalize}; }
else init();
</script>
